org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ALTO FORK: single-loader build (NeoForge 1.21.1, ModDevGradle). Upstream values kept below for reference.
# Upstream (unimined): minecraft_version=1.21, neoforge_version=20-beta, available_loaders=fabric,forge,neoforge,tweaker

## Upstream Baritone version this fork is based on (tag v1.11.3)
baritone_version=1.11.3
## Fork version (semantic, our own)
alto_version=1.0.0
maven_group=baritone
archives_base_name=baritone-alto

java_version=21

## Environment (matches the "Createrington Rails 'n Sails" Prism instance)
minecraft_version=1.21.1
neo_version=21.1.249
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

nether_pathfinder_version=1.6

## Optional integrations: compiled against the jars copied from the pack (compile-only, never shipped).
## Paths are relative to this folder; override with -Ppack_mods_dir=... if needed.
pack_mods_dir=../testenv/pack/mods
