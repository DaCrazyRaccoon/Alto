// ALTO FORK build (NeoForge 1.21.1 only, ModDevGradle). See settings.gradle for why this
// replaces upstream's unimined build. The Java sources keep upstream's layout:
//   src/api/java, src/main/java, src/launch/java      upstream common code (+ Alto packages)
//   neoforge/src/main/java                             NeoForge entry point + Alto platform glue
//   src/schematica_api/java                            compile-only stubs (never shipped)
//   src/test/java                                      unit tests (JUnit 4 upstream + JUnit 5 Alto)

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${baritone_version}-alto.${alto_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

sourceSets {
    schematica_api {
        java.srcDirs = ['src/schematica_api/java']
    }
    main {
        java.srcDirs = ['src/api/java', 'src/main/java', 'src/launch/java', 'neoforge/src/main/java']
        resources.srcDirs = ['src/api/resources', 'src/main/resources', 'neoforge/src/main/resources']
        // src/launch/resources only holds upstream's unimined manifest + the mixin config; the
        // mixin config is added below, the manifest is replaced by our jar manifest.
        resources.srcDir 'src/launch/resources'
        resources.exclude 'META-INF/MANIFEST.MF'
        compileClasspath += schematica_api.output
    }
    test {
        java.srcDirs = ['src/test/java']
        resources.srcDirs = ['src/test/resources']
    }
    // DEV-ONLY automation harness (boot/world/self-test runs). Never part of the release jar.
    devtest {
        java.srcDirs = ['src/devtest/java']
        resources.srcDirs = ['src/devtest/resources']
    }
}

configurations {
    // Libraries copied into our jar (upstream shades nether-pathfinder the same way).
    shade
    implementation.extendsFrom shade
}

repositories {
    maven {
        name = 'babbaj-repo'
        url = 'https://babbaj.github.io/maven/'
        content { includeGroup 'dev.babbaj' }
    }
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        baritoe {
            sourceSet(sourceSets.main)
        }
        alto_devtest {
            sourceSet(sourceSets.devtest)
        }
    }

    unitTest {
        enable()
        testedMod = mods.baritoe
    }

    runs {
        // Dev client with only Baritone (no Create, no EMI): soft-dependency test.
        client {
            client()
            gameDirectory = project.file(findProperty('alto_run_dir') ?: '../testenv/run-dev')
            loadedMods = [mods.baritoe, mods.alto_devtest]
        }
        // Dev client with a COPY of the pack's mods/configs (see preparePackRun). Never the real instance.
        packClient {
            client()
            gameDirectory = project.file('../testenv/run-pack')
            loadedMods = [mods.baritoe, mods.alto_devtest]
            jvmArguments.addAll('-Xmx8G', '-Xms2G')
            // Pack mods run extra dev-only self-checks; the harness switches FML to production mode (see DevTestHarness).
            systemProperty 'alto.devtest.production', 'true'
        }
        configureEach {
            // Marker so scripts/alto/test-client.ps1 can find (and only ever stop) its own test clients.
            jvmArgument "-Dalto.testclient=${name}"
            // Harness controls, e.g. -Palto_devtest=world -Palto_devtest_commands="selftest all"
            systemProperty 'alto.devtest', (findProperty('alto_devtest') ?: '').toString()
            systemProperty 'alto.devtest.commands', (findProperty('alto_devtest_commands') ?: '').toString()
            systemProperty 'alto.devtest.timeout', (findProperty('alto_devtest_timeout') ?: '900').toString()
            systemProperty 'alto.devtest.gamemode', (findProperty('alto_devtest_gamemode') ?: 'survival').toString()
        }
    }
}

// The schematica/litematica stubs and the dev harness need Minecraft on their compile classpath.
neoForge.addModdingDependenciesTo(sourceSets.schematica_api)
neoForge.addModdingDependenciesTo(sourceSets.devtest)

dependencies {
    shade "dev.babbaj:nether-pathfinder:${nether_pathfinder_version}"
    additionalRuntimeClasspath "dev.babbaj:nether-pathfinder:${nether_pathfinder_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events = ['failed', 'skipped']
        exceptionFormat = 'full'
    }
    // The script tests read the language docs (JSON schema, example scripts): re-run them when those change.
    inputs.dir('docs/alto').withPropertyName('altoScriptDocs').withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    archiveFileName = "${archives_base_name}-neoforge-${minecraft_version}-${project.version}.jar"
    from(configurations.shade.collect { zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
    from('LICENSE') { into 'META-INF' rename { 'LICENSE-baritone.txt' } }
    manifest {
        attributes(
                'Implementation-Title': 'Baritone (Alto fork)',
                'Implementation-Version': project.version,
                'Specification-Title': 'baritoe',
        )
    }
}

// ---------------------------------------------------------------------------------------------
// ALTO test environment helpers (dev only). Sources are the COPY in ../testenv/pack, which was
// copied read-only from the Prism instance; nothing here ever writes to the Prism folder.
// ---------------------------------------------------------------------------------------------
def seedOptions = { File dir ->
    // Fresh game dirs open the accessibility onboarding screen and pause on focus loss;
    // pre-seed both so automated runs are not blocked. Existing options are never overwritten.
    def options = new File(dir, 'options.txt')
    if (!options.exists()) {
        dir.mkdirs()
        options.text = ['onboardAccessibility:false', 'pauseOnLostFocus:false', 'narrator:0', ''].join(System.lineSeparator())
    }
}

tasks.register('prepareDevRun') {
    doLast { seedOptions(project.file(findProperty('alto_run_dir') ?: '../testenv/run-dev')) }
}

// Jars left out of DEV pack runs: Sinytra Connector cannot find the "clean" Minecraft jar inside a
// ModDevGradle environment ("Could not determine clean minecraft artifact path"), so it and the two
// Fabric mods it loads are excluded here. The production-style test (testenv/prod) loads all of them.
// continuity (connected textures) hard-requires connector. The user asked to ignore the Fabric mods.
def devPackExclude = (findProperty('alto_pack_exclude')
        ?: 'connector-*.jar,Axiom-*.jar,IrisExtension-*.jar,continuity-*.jar').toString().split(',').collect { it.trim() }

tasks.register('preparePackRun', Sync) {
    def packDir = project.file('../testenv/pack')
    def runDir = project.file('../testenv/run-pack')
    from(new File(packDir, 'mods')) { into 'mods'; exclude devPackExclude }
    from(new File(packDir, 'config')) { into 'config' }
    from(new File(packDir, 'kubejs')) { into 'kubejs' }
    from(new File(packDir, 'defaultconfigs')) { into 'defaultconfigs' }
    into runDir
    doFirst {
        // Some mods mark files hidden (e.g. euphoria_patcher/.data.json); Windows refuses to overwrite hidden files.
        def cfg = new File(runDir, 'config')
        if (cfg.exists()) {
            cfg.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                java.nio.file.Files.setAttribute(f.toPath(), 'dos:hidden', false)
            }
        }
    }
    // Keep what the game creates at runtime (worlds, logs, options, Baritone data).
    preserve {
        include 'saves/**', 'logs/**', 'crash-reports/**', 'options.txt', 'baritone/**', 'screenshots/**',
                'alto-devtest-report.txt', 'mods/.connector/**', '*.json', '*.dat', '*.txt', 'local/**', 'data/**',
                'xaero/**', 'journeymap/**', 'shaderpacks/**', 'resourcepacks/**', 'schematics/**'
    }
    doLast {
        seedOptions(runDir)
        // Make the test window impossible to confuse with the real game: retitle it in the RUN copy only.
        def kube = new File(runDir, 'kubejs/config/client.json')
        if (kube.exists()) {
            kube.setText(kube.getText('UTF-8').replaceFirst('"window_title": "[^"]*"', '"window_title": "ALTO TEST CLIENT (copy of the pack)"'), 'UTF-8')
        }
        def fancy = new File(runDir, 'config/fancymenu/options.txt')
        if (fancy.exists()) {
            fancy.setText(fancy.getText('UTF-8').replaceFirst("custom_window_title = '[^']*'", "custom_window_title = 'ALTO TEST CLIENT (copy of the pack)'"), 'UTF-8')
        }
    }
}
