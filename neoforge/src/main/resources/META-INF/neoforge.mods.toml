# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory
# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion="[1,)" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license="LGPL-3.0-or-later (modified version of Baritone)"
# A URL to refer people to when problems occur with this mod
# ALTO FORK: Alto's own issue tracker. Problems with Alto must not go to the Baritone team.
issueTrackerURL="https://github.com/DaCrazyRaccoon/Alto/issues" #optional
# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory
# The modid of the mod
modId="baritoe" #mandatory
# The version number of the mod - there's a few well known ${} variables useable here or just hardcode it
version="${version}" #mandatory
 # A display name for the mod
displayName="Alto (unofficial Baritone fork)" #mandatory
# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL="https://github.com/DaCrazyRaccoon/Alto" #optional
# A file name (in the root of the mod JAR) containing a logo for display
#logoFile="examplemod.png" #optional
# A text field displayed in the mod UI
credits="Hat Gamers" #optional
# A text field displayed in the mod UI
authors="Baritone: leijurv, Brady and contributors. Alto: DaCrazyRaccoon" #optional
# The description text for the mod (multi line!) (#mandatory)
description='''
Alto is a vibecoded modification of Baritone. It is not made by the Baritone team, and the Baritone team does not support it.
Adds container use to Baritone: crafting, smelting, storage, Create and EMI support, scripts.
Licensed under the LGPL-3.0 like Baritone. If you give this jar to others, give them its source too (META-INF/ALTO-LICENSE-NOTE.md).
'''

[[dependencies.baritoe]]
modId="minecraft"
type="required"
# This version range declares a minimum of the current minecraft version up to but not including the next major version
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

# ALTO FORK: NeoForge reads mixin configs from here (upstream's unimined build put them in the manifest).
[[mixins]]
config="mixins.baritone.json"

[[dependencies.baritoe]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="CLIENT"

# Optional integrations (soft dependencies). Alto works without them, and with any version of them: support for a
# mod whose version does not match is switched off at runtime instead of blocking the game from starting.
# (Tested with Create 6.0.10 and EMI 1.1.24.)
[[dependencies.baritoe]]
modId="create"
type="optional"
versionRange="*"
ordering="NONE"
side="CLIENT"

[[dependencies.baritoe]]
modId="emi"
type="optional"
versionRange="*"
ordering="NONE"
side="CLIENT"
