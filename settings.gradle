// ALTO FORK: upstream builds every loader with the "unimined" Gradle plugin from
// maven.wagyourtail.xyz. This fork targets NeoForge 1.21.1 only and builds with
// NeoForge's official ModDevGradle plugin instead (see docs/alto/DEVELOPER.md, "Build").
// The fabric/, forge/ and tweaker/ folders are kept unchanged for easier upstream merges
// but are not part of this build.
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'baritone'
